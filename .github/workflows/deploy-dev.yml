name: Deploy dev

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -eu
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            cd ~/supergloss/word-collector
            previous_commit=$(git rev-parse HEAD)
            git fetch origin dev
            git reset --hard origin/dev
            current_commit=$(git rev-parse HEAD)
            import_jmdict=false
            if git diff --name-only "$previous_commit" "$current_commit" | grep -E '^(backend/scripts/import_jmdict\.js|backend/migrations/.*jmdict|data/dictionaries/JMdict_e\.gz)$'; then
              import_jmdict=true
            fi

            npm install
            npm run build:css -w frontend
            cd backend
            DATABASE_URL=$(grep '^DATABASE_URL=' ~/supergloss/word-collector/.env | cut -d= -f2-) npx node-pg-migrate up
            if [ "$import_jmdict" = true ]; then
              DATABASE_URL=$(grep '^DATABASE_URL=' ~/supergloss/word-collector/.env | cut -d= -f2-) npm run import:jmdict
            fi
            cd ..

            pm2 restart word-marker
