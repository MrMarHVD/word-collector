name: Deploy dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

# Never cancel a running deploy: a new push waits instead of cutting the SSH
# session mid-migration or mid-swap.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -eu
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            cd ~/supergloss/word-collector
            previous_commit=$(git rev-parse HEAD)
            git fetch origin dev
            git reset --hard origin/dev
            current_commit=$(git rev-parse HEAD)
            import_jmdict=false
            if git diff --name-only "$previous_commit" "$current_commit" | grep -E '^(backend/scripts/import_jmdict\.js|backend/migrations/.*jmdict|data/dictionaries/JMdict_e\.gz)$'; then
              import_jmdict=true
            fi

            # Dev dependencies are needed for the frontend build, even under NODE_ENV=production.
            npm install --include=dev
            npm run fetch:mt-models -w backend
            # Build into a fresh, uniquely named directory; frontend/dist is repointed to it just before
            # the restart, so the running process never serves an emptied or half-written build, and a
            # re-run of the same commit never touches the live build.
            build_dir=".dist-$current_commit-$(date -u +%Y%m%d%H%M%S)"
            npm run build -w frontend -- --outDir "$build_dir"
            # The migrate and import scripts read DATABASE_URL from .env themselves, keeping it out of argv.
            npm run migrate:up -w backend
            if [ "$import_jmdict" = true ]; then
              npm run import:jmdict -w backend
            fi

            # Atomically swap the frontend/dist symlink. A pre-existing real directory (first deploy) is
            # moved aside to .dist-legacy rather than deleted, and kept as the previous build.
            ln -sfn "$build_dir" frontend/dist.next
            if [ -d frontend/dist ] && [ ! -L frontend/dist ]; then
              previous_build=".dist-legacy"
              rm -rf "frontend/$previous_build"
              mv -T frontend/dist "frontend/$previous_build"
            else
              previous_build=$(basename "$(readlink frontend/dist 2>/dev/null || echo none)")
            fi
            mv -Tf frontend/dist.next frontend/dist
            # Keep the previous build for one deploy, so open tabs can still load its lazy chunks.
            find frontend -maxdepth 1 -name '.dist-*' ! -name "$build_dir" ! -name "$previous_build" -exec rm -rf {} +

            pm2 restart word-marker
