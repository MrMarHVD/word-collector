<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Collector</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="authView" class="auth-shell" hidden>
      <section class="auth-panel">
        <p class="eyebrow" data-i18n="brand">Word Collector</p>
        <h1 data-i18n="auth.title">ログイン</h1>
        <div class="auth-tabs">
          <button class="auth-mode-button is-active" type="button" data-auth-mode="login" data-i18n="auth.login">ログイン</button>
          <button class="auth-mode-button" type="button" data-auth-mode="register" data-i18n="auth.register">登録</button>
        </div>
        <form id="authForm">
          <label>
            <span data-i18n="auth.email">メール</span>
            <input id="authEmail" type="email" autocomplete="email" required />
          </label>
          <label>
            <span data-i18n="auth.password">パスワード</span>
            <input id="authPassword" type="password" autocomplete="current-password" required />
          </label>
          <label id="authConfirmWrap" hidden>
            <span data-i18n="auth.confirmPassword">パスワード確認</span>
            <input id="authConfirmPassword" type="password" autocomplete="new-password" />
          </label>
          <button id="authSubmit" type="submit" data-i18n="auth.login">ログイン</button>
          <p id="authStatus" class="status" role="status"></p>
        </form>
      </section>
    </main>

    <main id="onboardingView" class="auth-shell" hidden>
      <section class="auth-panel">
        <p class="eyebrow" data-i18n="brand">Word Collector</p>
        <h1 data-i18n="onboarding.title">What language do you want to learn?</h1>
        <div id="onboardingLanguages" class="language-picks"></div>
        <p id="onboardingStatus" class="status" role="status"></p>
      </section>
    </main>

    <main id="appShell" class="shell" hidden>
      <header class="menu-bar">
        <div class="menu-left">
          <div class="menu-brand" data-i18n="brand">Word Collector</div>
          <nav class="tabs" aria-label="Main views">
            <button class="tab-button is-active" type="button" data-tab="dashboard" data-i18n="tabs.dashboard">ダッシュボード</button>
            <button class="tab-button" type="button" data-tab="collections" data-i18n="tabs.collections">コレクション</button>
            <button class="tab-button" type="button" data-tab="reader" data-i18n="tabs.reader">Reader</button>
          </nav>
        </div>
        <div class="menu-actions">
          <div class="locale-buttons" aria-label="UI language">
            <button class="locale-button" type="button" data-locale="ja" data-i18n="ui.japanese">日本語</button>
            <button class="locale-button" type="button" data-locale="en" data-i18n="ui.english">English</button>
          </div>
          <button id="settingsButton" class="secondary-button icon-button tab-button" type="button" data-tab="settings">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.3a2 2 0 0 1-4 0V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H2.7a2 2 0 0 1 0-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7A2 2 0 0 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.3a2 2 0 0 1 4 0V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.3a2 2 0 0 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z" />
            </svg>
            <span class="visually-hidden" data-i18n="tabs.settings">Settings</span>
          </button>
          <button id="logoutButton" class="secondary-button logout-button" type="button" data-i18n="auth.logout">ログアウト</button>
        </div>
      </header>

      <header id="pageHead" class="page-head">
        <div>
          <p class="eyebrow" data-i18n="brand">Word Collector</p>
          <h1 data-i18n="app.title">Word Collector</h1>
        </div>
        <div class="page-head-actions">
          <div class="learning-switcher">
            <label for="dashboardLanguageSelect" data-i18n="learning.current">学習中の言語</label>
            <div class="learning-controls">
              <select id="dashboardLanguageSelect"></select>
            </div>
          </div>
          <div class="total-panel">
            <span id="knownTotal">0</span>
            <small data-i18n="stats.knownAll">全コレクションの既知単語</small>
          </div>
        </div>
      </header>

      <section id="dashboardView" class="tab-view">
        <section class="metrics" aria-label="Overall progress">
          <article>
            <span id="totalWords">0</span>
            <small data-i18n="dashboard.totalWords">単語数</small>
          </article>
          <article>
            <span id="unknownTotal">0</span>
            <small data-i18n="dashboard.unknownWords">未習得</small>
          </article>
          <article>
            <span id="collectionCount">0</span>
            <small data-i18n="dashboard.collectionCount">コレクション数</small>
          </article>
        </section>

        <section class="collection-panel">
          <div class="section-head">
            <h2 data-i18n="dashboard.collectionProgress">コレクション別の進捗</h2>
          </div>
          <div id="collectionCharts" class="chart-grid"></div>
        </section>
      </section>

      <section id="collectionsView" class="tab-view" hidden>
        <section class="workspace">
          <form id="uploadForm" class="upload-panel">
            <div class="section-head">
              <h2 data-i18n="upload.title">CSVアップロード</h2>
            </div>
            <label>
              <span data-i18n="upload.language">言語</span>
              <select id="uploadLanguageSelect"></select>
            </label>
            <label>
              <span data-i18n="upload.collection">コレクション名</span>
              <input id="collectionName" name="collectionName" type="text" data-i18n-placeholder="upload.collectionPlaceholder" placeholder="日本語 基本単語" required />
            </label>
            <label>
              <span data-i18n="upload.file">CSVファイル</span>
              <input id="csvFile" name="csvFile" type="file" accept=".csv,text/csv,text/plain" required />
            </label>
            <p class="hint" data-i18n="upload.format">形式: word translation</p>
            <button type="submit" data-i18n="upload.button">アップロード</button>
            <p id="uploadStatus" class="status" role="status"></p>
          </form>

          <section class="browser-panel">
            <div class="section-head">
              <h2 data-i18n="collections.wordsTitle">単語一覧</h2>
              <div class="collection-actions">
                <div class="display-mode-buttons">
                  <button class="display-mode-button is-active" type="button" data-display-mode="all" data-i18n="collections.displayAll">すべて</button>
                  <button class="display-mode-button" type="button" data-display-mode="infinite" data-i18n="collections.displayInfinite">Infinite Scroll</button>
                </div>
                <button id="saveCollectionLanguageButton" class="secondary-button" type="button" data-i18n="collections.save">保存</button>
                <button id="deleteCollectionButton" class="danger-button" type="button" data-i18n="collections.delete">削除</button>
              </div>
            </div>
            <div class="browser-tools">
              <label>
                <span data-i18n="collections.collection">コレクション</span>
                <select id="collectionSelect"></select>
              </label>
              <label>
                <span data-i18n="collections.language">言語</span>
                <select id="collectionLanguageSelect"></select>
              </label>
              <label>
                <span data-i18n="collections.search">検索</span>
                <input id="searchInput" type="search" data-i18n-placeholder="collections.searchPlaceholder" placeholder="単語または翻訳で検索" />
              </label>
            </div>
            <div id="selectedCollectionStats" class="selected-stats"></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th data-i18n="table.word">単語</th>
                    <th data-i18n="table.translation">翻訳</th>
                    <th data-i18n="table.status">状態</th>
                  </tr>
                </thead>
                <tbody id="wordRows"></tbody>
              </table>
            </div>
            <p id="wordListStatus" class="list-status" role="status"></p>
            <p id="emptyState" class="empty" data-i18n="collections.empty">CSVをアップロードして最初のコレクションを作成してください。</p>
          </section>
        </section>
      </section>
      <section id="readerView" class="tab-view" hidden>
        <button id="readerSidebarOpen" class="reader-sidebar-open secondary-button" type="button" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 5h16M4 12h16M4 19h16" />
          </svg>
          <span class="visually-hidden" data-i18n="reader.openSidebar">Open sidebar</span>
        </button>
        <section class="reader-layout">
          <aside class="reader-sidebar">
            <div class="reader-sidebar-head">
              <button id="readerSidebarToggle" class="secondary-button icon-button" type="button" aria-expanded="true">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M15 6l-6 6 6 6" />
                </svg>
                <span class="visually-hidden" data-i18n="reader.toggleSidebar">Toggle sidebar</span>
              </button>
            </div>
            <form id="materialImportForm" class="reader-import">
              <label>
                <span data-i18n="reader.language">言語</span>
                <select id="readerLanguageSelect"></select>
              </label>
              <label>
                <span data-i18n="reader.import">インポート</span>
                <input id="materialFile" type="file" accept=".pdf,.epub,.txt,application/pdf,application/epub+zip,text/plain" />
              </label>
              <button type="submit" data-i18n="reader.importButton">インポート</button>
              <p id="materialImportStatus" class="status" role="status"></p>
            </form>
            <div id="materialList" class="material-list"></div>
            <div id="readerSidebarResize" class="reader-resize-handle" role="separator" aria-orientation="vertical"></div>
          </aside>
          <section class="reader-panel">
            <div class="reader-toolbar">
              <div>
                <h2 id="readerTitle" data-i18n="reader.title">Reader</h2>
                <p id="readerMeta" class="hint"></p>
              </div>
              <div class="reader-controls">
                <label>
                  <span data-i18n="reader.fontSize">文字サイズ</span>
                  <input id="readerFontSize" type="range" min="16" max="34" value="22" />
                </label>
                <label>
                  <span data-i18n="reader.wordsPerPage">ページ語数</span>
                  <select id="readerWordsPerPage">
                    <option value="100">100</option>
                    <option value="250" selected>250</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                  </select>
                </label>
              </div>
            </div>
            <div id="readerText" class="reader-text"></div>
            <div class="reader-page-actions">
              <button id="readerPrevPage" class="secondary-button" type="button" data-i18n="reader.previous">前へ</button>
              <span id="readerPageStatus" class="hint"></span>
              <button id="readerNextPage" class="secondary-button" type="button" data-i18n="reader.next">次へ</button>
            </div>
            <aside id="readerWordInfo" class="reader-word-info" hidden></aside>
            <div id="readerPanelResize" class="reader-panel-resize" role="separator" aria-orientation="vertical"></div>
          </section>
        </section>
      </section>
      <section id="settingsView" class="tab-view" hidden>
        <section class="settings-panel">
          <div class="section-head">
            <h2 data-i18n="settings.title">設定</h2>
          </div>
          <form id="settingsForm">
            <label>
              <span data-i18n="settings.nativeLanguage">母語</span>
              <select id="nativeLanguageSelect"></select>
            </label>
            <p class="hint" data-i18n="settings.nativeLanguageHint">翻訳や説明に使う言語です。</p>
            <button type="submit" data-i18n="settings.save">保存</button>
            <p id="settingsStatus" class="status" role="status"></p>
          </form>
        </section>
      </section>
      <datalist id="languageOptions"></datalist>
    </main>

    <script src="/js/main.js" type="module"></script>
  </body>
</html>
