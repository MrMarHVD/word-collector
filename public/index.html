<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Marker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Word Marker</p>
          <h1>単語コレクション</h1>
        </div>
        <div class="total-panel">
          <span id="knownTotal">0</span>
          <small>全コレクションの既知単語</small>
        </div>
      </header>

      <nav class="tabs" aria-label="Main views">
        <button class="tab-button is-active" type="button" data-tab="dashboard">ダッシュボード</button>
        <button class="tab-button" type="button" data-tab="collections">コレクション</button>
      </nav>

      <section id="dashboardView" class="tab-view">
        <section class="filter-panel">
          <label>
            表示する言語
            <select id="dashboardLanguageSelect">
              <option value="">すべての言語</option>
            </select>
          </label>
        </section>

        <section class="metrics" aria-label="Overall progress">
          <article>
            <span id="totalWords">0</span>
            <small>単語数</small>
          </article>
          <article>
            <span id="unknownTotal">0</span>
            <small>未習得</small>
          </article>
          <article>
            <span id="collectionCount">0</span>
            <small>コレクション数</small>
          </article>
        </section>

        <section class="collection-panel">
          <div class="section-head">
            <h2>コレクション別の進捗</h2>
          </div>
          <div id="collectionCharts" class="chart-grid"></div>
        </section>
      </section>

      <section id="collectionsView" class="tab-view" hidden>
        <section class="workspace">
          <form id="uploadForm" class="upload-panel">
            <div class="section-head">
              <h2>CSVアップロード</h2>
            </div>
            <label>
              言語
              <input id="uploadLanguageName" name="uploadLanguageName" type="text" list="languageOptions" placeholder="日本語" required />
            </label>
            <label>
              コレクション名
              <input id="collectionName" name="collectionName" type="text" placeholder="日本語 基本単語" required />
            </label>
            <label>
              CSVファイル
              <input id="csvFile" name="csvFile" type="file" accept=".csv,text/csv,text/plain" required />
            </label>
            <p class="hint">形式: word translation</p>
            <button type="submit">アップロード</button>
            <p id="uploadStatus" class="status" role="status"></p>
          </form>

          <section class="browser-panel">
            <div class="section-head">
              <h2>単語一覧</h2>
              <button id="deleteCollectionButton" class="danger-button" type="button">削除</button>
            </div>
            <div class="browser-tools">
              <label>
                コレクション
                <select id="collectionSelect"></select>
              </label>
              <label>
                言語
                <input id="collectionLanguageName" type="text" list="languageOptions" placeholder="日本語" />
              </label>
              <button id="saveCollectionLanguageButton" class="secondary-button" type="button">保存</button>
              <label>
                検索
                <input id="searchInput" type="search" placeholder="単語または翻訳で検索" />
              </label>
            </div>
            <div id="selectedCollectionStats" class="selected-stats"></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>単語</th>
                    <th>翻訳</th>
                    <th>状態</th>
                  </tr>
                </thead>
                <tbody id="wordRows"></tbody>
              </table>
            </div>
            <p id="emptyState" class="empty">CSVをアップロードして最初のコレクションを作成してください。</p>
          </section>
        </section>
      </section>
      <datalist id="languageOptions"></datalist>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
