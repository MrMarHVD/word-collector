code: DS-011
title: "Remove legacy shared CSS, enforce the design system, docs and full suite"
status: to do
spec: SPEC-005-design-system-standardisation
summary: >
  Delete the now-unused legacy shared CSS and tokens, add lint and style-lint enforcement of the canonical design system (proven with a deliberate violation), finalise the docs, and run the full suite.
scope:
  files:
    - "frontend/src/styles/** (delete legacy shared classes: components.css, shell.css leftovers, the --shadow-panel token, etc.)"
    - "frontend/eslint.config.* and a new stylelint config, plus package.json scripts and the CI workflow"
    - "AGENTS.md and frontend/src/CONTRACTS.md (final pass)"
    - "frontend/src/** (removing any remaining stray usages found by the new rules)"
  layers:
    - frontend
    - tooling
    - docs
  description: >
    In scope:
    - Delete legacy shared classes and tokens that are no longer referenced.
    - ESLint rules banning:
      - raw <button>, <input>, <select>, <textarea> and <table> in features/** (allow-listing the documented NativeSelect exceptions);
      - shadow-panel, font-black, font-extrabold and off-scale rounded-* utilities.
    - A style-lint config banning raw colours, border-radius, box-shadow and font-weight values outside styles/.
    - Add both to `npm run lint` and CI.
    - Prove the rules with a deliberate violation that fails, then revert it.
    - Final pass on AGENTS.md and CONTRACTS.md.
    - Run the full suite.
    Out of scope: new visual changes.
dependencies:
  - DS-003
  - DS-004
  - DS-005
  - DS-006
  - DS-007
  - DS-008
  - DS-009
  - DS-010
acceptance_criteria:
  - "No legacy shared CSS classes or the panel-shadow token remain, and nothing references them."
  - "lint (including the new rules) and style-lint pass on the codebase. A deliberate violation of each rule type fails locally and in CI, shown and then reverted."
  - "AGENTS.md and CONTRACTS.md accurately describe the canonical system and the binding rules."
  - "lint, typecheck, Vitest and build pass. The full `npm run test:e2e` passes (429s identified, then rerun individually)."
verification:
  - "In frontend/, `npm run lint`, `npm run typecheck`, `npm test` and `npm run build` all pass."
  - "Commit and revert a deliberate violation of each rule, showing the failing output."
  - "Run the full suite with PW_FRONTEND_URL=http://localhost:5511 PW_API_URL=http://localhost:3311, then rerun each file individually after an API restart."
special_context: |
  D1 Design tokens and fonts (DS-001 produces; every later issue uses).
  Defined in frontend/src/styles/ (theme.css / shadcn.css) for light and
  dark, mapped into Tailwind @theme, and documented in CONTRACTS.md "Design
  tokens":
  - colour:
    - neutral greys --color-* with no green tint;
    - ONE accent (--accent, --accent-foreground, --accent-subtle), a subtle
      light-blue / blue-teal, for primary actions, links, focus and active
      states only;
    - status colours for word states (unknown, learning, known);
  - surfaces: --surface-page, --surface-panel, --surface-subtle (a tonal
    step), --surface-reader (warm paper / soft dark);
  - border: one hairline --border (1px) plus --border-strong for inputs;
  - radius scale (exactly): --radius-control, --radius-container, and
    --radius-pill (badges only);
  - type scale and text styles: title, heading, body, caption (sizes and line
    heights); weights 400/500/600 only;
  - elevation: --shadow-float, for floating layers only; NO panel shadow;
  - glass material: --glass-bg, --glass-border, --glass-blur, plus a utility
    or class (e.g. `.glass`) with a solid fallback under
    @media (prefers-reduced-transparency: reduce) and when backdrop-filter is
    unsupported;
  - focus: --focus-ring (accent based) and one focus-visible utility;
  - fonts: a font registry module (e.g. src/lib/fonts.ts) listing reading
    fonts { id, label, latinFamily, cjkFamilies } with one entry,
    "ia-quattro" (iA Writer Quattro + Noto Sans JP/SC), and a
    --font-reading token. iA Writer Quattro is self-hosted unmodified (SIL OFL
    1.1, Reserved Font Name "iA Writer"); Noto JP/SC are self-hosted with
    unicode-range subsets.

  D2 Canonical component catalogue (DS-002 produces; DS-003..011 use).
  Exactly one implementation each, in components/ui (kit) or components/app,
  documented in CONTRACTS.md "Canonical components" with variants, sizes and
  props:
  - Button: primary, secondary, ghost, destructive; sizes sm, md, lg.
  - IconButton: sizes sm and md, with a required aria-label.
  - Card: one flat style (hairline OR tonal, no shadow); slots for header,
    content and footer.
  - Input, Textarea, Select (kit, plus a NativeSelect wrapper for the
    test-hook exceptions).
  - Tabs: underline style, for page navigation.
  - Segmented: value picking.
  - Switch, Slider, Checkbox.
  - ListRow: hairline-divided row with a tonal hover; slots for leading,
    title, meta, trailing and actions.
  - Badge: neutral plus word-status variants.
  - Floating material (glass): Dialog, AlertDialog, Sheet, Popover,
    DropdownMenu, Toast.
  - Table: kit, with hairline rows and normal-case headers.
  - SettingSection and SettingRow.
  - Text components or classes for title, heading, body and caption.
  The style guide at /styleguide (dev and internal) renders every component
  and variant in light and dark.

  D3 Migration rules (for DS-003..DS-010).
  - Use ONLY D2 components and D1 tokens.
  - Do NOT edit components/ui/**, components/app/** or styles/** (DS-002 and
    DS-011 own them). If a needed component or variant is missing, stop and
    report it to the orchestrator, describing the need. Never build a local
    substitute.
  - Delete your area's legacy classes and feature-CSS rules. Feature CSS may
    keep layout only (grid, flex, sizes, positioning), with no colours,
    borders, radii, shadows or typography values.
  - No raw <button>, <input>, <select>, <textarea> or <table> in your area,
    except the documented native-select test-hook exceptions
    (CONTRACTS.md).
  - Preserve every test hook (ids, data-*, ARIA) and all behaviour. Spec
    edits only where markup necessarily changes, asserting the same
    behaviour, each listed.
  - No content-panel shadows, no nested bordered boxes, glass only on chrome
    and floating layers, and weights 400–600 only.

  General rules:
  - Follow AGENTS.md: ja/en/zh localisation, mobile parity ≤760px, commits
    allowed.
  - Follow frontend/src/CONTRACTS.md, including the Motion conventions and
    reduced motion.
  - Accessibility: WCAG AA contrast in light and dark, including text over
    glass, and a visible focus indicator.
  - Contracts are fixed. If one blocks you, stop and report.
  - Ports: use only your assigned ports and export PW_FRONTEND_URL/PW_API_URL
    explicitly in every Playwright command. Never hit or kill 3000/5173 (the
    user's servers) or other agents' ports.
  - Test database: the shared dev DB may lack recent migrations. Verify
    against a temporary database:
    1. create it on the same server and migrate it;
    2. point your worktree .env at it;
    3. afterwards, restore .env and drop the database.
  - The known login rate limit can produce 429s. Restart the API and rerun,
    and identify any 429s explicitly.
implementation_notes: >
  Use grep-based inventories before deleting anything. Keep the rules precise so the documented exceptions don't need blanket disables.
