code: LIB-004
title: "Category sidebar: list, create, rename, reorder, delete, drop targets"
status: to do
spec: SPEC-004-library-and-reader
summary: >
  Implement CategorySidebar: permanent All and Uncategorised plus user categories with counts; create, rename, reorder and delete; drop targets for dragged works; narrow, expanded on first visit and remembered; mobile layout.
scope:
  files:
    - "frontend/src/features/library/categories/**"
    - "frontend/public/locales.json (library.categories.* keys)"
  layers:
    - frontend
  description: >
    In scope: SPEC-004 FR-11..17, FR-25, FR-26 and FR-28, using the C3 hooks, the C4 ids and props, and the visual language of the settings primitives (SettingSection-like grouping).
    - Rename inline or via a dialog; delete with confirmation, noting that works move to Uncategorised.
    - Reorder by drag within the list, plus a keyboard alternative (e.g. Move up/down actions).
    - Expanded state: expanded by default on first visit, then the user's choice persisted in localStorage (key wordMarkerLibraryCategoriesExpanded).
    - Mobile: an expandable control above the list, or a sheet, consistent with the app.

    Out of scope: the list and rows (LIB-003).
dependencies:
  - LIB-001
  - LIB-002
acceptance_criteria:
  - "All and Uncategorised are always present with correct counts, and can't be renamed, deleted or reordered."
  - "Create, rename (duplicate names rejected with a localised message), reorder (persisted) and delete (works become Uncategorised) all work and survive a reload."
  - "Dropping a dragged work (C4 data type) on a category assigns it, and on Uncategorised unassigns it, with a visible drop indicator. All isn't a drop target."
  - "Keyboard users can do every category action, including reordering."
  - "The sidebar is narrow next to the list, expanded on first visit, and its collapsed state persists."
  - "Desktop and mobile are complete in both themes; strings exist in ja/en/zh."
verification:
  - "In frontend/, `npm run lint`, `npm run typecheck`, `npm test` and `npm run build` all pass."
  - "Run Playwright against your own servers (PW_FRONTEND_URL/PW_API_URL on your assigned ports, which the config auto-starts)."
  - "Review screenshots at 1280 and 390, light and dark, in en plus one CJK locale."
  - "Ports: PW_FRONTEND_URL=http://localhost:5404 PW_API_URL=http://localhost:3204. Use a throwaway spec for CRUD, reorder and drag/drop (Playwright dragTo with the dataTransfer type)."
special_context: |
  C1 API (LIB-001 produces; LIB-002 wraps it in the typed client). All
  endpoints require auth plus CSRF on mutations, and enforce ownership (404
  for another user's resources).
  - GET /api/categories?languageId=N
      -> 200 { categories: [{ id, name, position, materialCount }],
              totalCount, uncategorisedCount }
         categories are ordered by position.
  - POST /api/categories { languageId, name }
      -> 201 { category }; 409 errorKey "errors.categoryNameTaken" for a
         case-insensitive duplicate; 400 for an empty or too-long name
         (max 60 chars, trimmed).
  - PATCH /api/categories/:id { name } -> 200 { category }; 409 or 400 as
    above.
  - PUT /api/categories/order { languageId, ids: number[] }
      -> 200 { categories }; ids must be exactly the user's categories for
         that language.
  - DELETE /api/categories/:id -> 200 { ok: true }; its works become
    uncategorised, and works are never deleted.
  - PATCH /api/materials/:id accepts { categoryId: number | null } (in
    addition to the existing fields). The category must belong to the same
    user and language (400 otherwise); null means uncategorised.
  - POST /api/materials/:id/opened -> 200 { lastOpenedAt }: records that the
    work was opened in the Reader.
  - GET /api/materials?languageId=N&offset=&search=&category=all|uncategorised|<id>
      keeps the existing params and response shape ({ materials, pageSize })
      and adds category filtering. Each material item gains categoryId
      (number|null), lastOpenedAt (ISO|null), readTokens and totalTokens
      (reading progress, as the dashboard documents use), on top of the
      existing id, title, fileType, wordCount, readerStart, createdAt and
      import status fields. Default sort: lastOpenedAt DESC NULLS LAST, then
      createdAt DESC, then id DESC. search matches the title
      case-insensitively.

  C3 Data hooks (LIB-002 produces in frontend/src/features/library/data/;
  LIB-003/004 use).
  - useLibraryMaterials({ category, search }): an infinite query over C1's
    list (pages of 50), polling while any work is importing or translating,
    as MaterialList does today.
  - useCategories(): returns { categories, totalCount, uncategorisedCount }.
  - useCategoryMutations(): returns { create(name), rename(id, name),
    reorder(ids), remove(id) }. Each invalidates categories and library
    materials.
  - useAssignCategory(): returns assign(materialId, categoryId | null), with
    an optimistic update of the list and counts and rollback on error.
  - Query keys go under queryKeys.library.* and queryKeys.categories.* in
    lib/api/query-keys.ts.

  C4 Library and category-sidebar connection (LIB-002 creates the stubs;
  LIB-003 owns LibraryPage, LIB-004 owns the sidebar).
  - LibraryPage renders
    <CategorySidebar selected={category} onSelect={(c) => …} /> from
    frontend/src/features/library/categories/CategorySidebar.tsx, where
    category is "all" | "uncategorised" | number.
  - Drag source (LIB-003): each work row is draggable and sets
    dataTransfer "application/x-word-marker-material" = String(materialId).
    Drop targets (LIB-004) read that type, call
    useAssignCategory().assign(id, categoryId | null) (Uncategorised = null;
    All isn't a drop target), and show a drop indicator.
  - Keyboard and touch alternative (LIB-003): each row's ⋯ menu has
    "Move to category ▸", listing Uncategorised plus the user categories
    from useCategories() and calling assign.
  - Ids: the sidebar root is #libraryCategories; each category item has
    data-category="all" | "uncategorised" | "<id>".

  General rules: follow AGENTS.md (localisation in ja/en/zh, mobile
  parity ≤760px, design consistency with the kit and the existing settings
  primitives, TypeScript docs, and commits allowed). Follow
  frontend/src/CONTRACTS.md, including the Motion conventions and reduced
  motion. Interface contracts are fixed: if one blocks you, stop and report
  rather than improvise. Never kill processes on ports you weren't assigned
  (3000/5173 may be the user's servers). The login rate limiter (10 per 15
  minutes) can cause 429s in the admin/superadmin specs; restart the API and
  rerun, and identify any 429s explicitly.
implementation_notes: >
  In this worktree, LIB-003's rows may still be LIB-002's placeholder. Test drops with a synthetic drag source carrying the C4 data type. Keep drop-target handling independent of row markup.
