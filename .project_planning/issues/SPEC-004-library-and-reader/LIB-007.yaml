code: LIB-007
title: "Naming cleanup, tests, docs and full suite"
status: to do
spec: SPEC-004-library-and-reader
summary: >
  Make 'Library' and 'Reader' consistent across the codebase, UI text and docs; remove obsolete names, keys and code; update and extend the Playwright specs; and run the full suite.
scope:
  files:
    - "frontend/src/** (renames and dead-code removal only)"
    - "frontend/public/locales.json (remove obsolete reader tab keys, e.g. reader.documentsTab, readTab, settingsTab, toggleSidebar, openSidebar, focus, only if unused)"
    - "tests/smoke/** (updated and new specs)"
    - "frontend/src/CONTRACTS.md, AGENTS.md (naming and structure)"
    - "backend/** (naming only, if the old naming leaks into user-facing or API docs)"
  layers:
    - frontend
    - tests
    - docs
  description: >
    In scope:
    - Grep the code, text and docs for the old combined-reader naming and remove or rename it consistently.
    - Delete dead code left by LIB-005.
    - Update app, imports and reader-translation specs for the new routes.
    - Add specs for:
      - library search and sort;
      - category CRUD, reorder and delete-moves-to-uncategorised;
      - drag-to-category and keyboard 'Move to category';
      - the /reader/:id deep link and /reader redirect;
      - the Aa panel (open, change setting, Escape);
      - exit to the Library;
      - the dashboard go-to.
    - Run the full suite and record the results.

    Out of scope: new features.
dependencies:
  - LIB-003
  - LIB-004
  - LIB-005
  - LIB-006
acceptance_criteria:
  - "No leftover UI text, keys, routes, ids or module names refer to the old combined reader or its tabs. 'Library' and 'Reader' are used consistently in ja/en/zh, routes, folders and docs."
  - "The new specs cover every SPEC-004 acceptance criterion. Existing specs are updated, with every edit listed and reasoned."
  - "lint, typecheck, Vitest and build pass, and the full `npm run test:e2e` passes (429s identified and rerun individually)."
  - "CONTRACTS.md and AGENTS.md describe the Library/Reader structure accurately."
verification:
  - "In frontend/, `npm run lint`, `npm run typecheck`, `npm test` and `npm run build` all pass."
  - "Run Playwright against your own servers (PW_FRONTEND_URL/PW_API_URL on your assigned ports, which the config auto-starts)."
  - "Ports: PW_FRONTEND_URL=http://localhost:5407 PW_API_URL=http://localhost:3207. Run the full suite, then rerun each file individually after an API restart."
special_context: |
  C2 Routes and Library address (LIB-002 produces; LIB-003/004/005/006 use).
  - /library — the Library. Search params:
    - category = all | uncategorised | <categoryId> (default all);
    - q = search text;
    - focus = <materialId>: the dashboard "go to" target. The Library selects
      category=all, clears q, scrolls the work into view, outlines it with a
      transition, then removes focus from the address (replace) so a reload
      doesn't repeat it.
  - /reader/:materialId — the Reader for that work.
  - /reader — redirects to the last-opened work for the study language
    (lastOpenedAt from C1, falling back to the existing
    wordMarkerSelectedMaterialId:<userId>:<languageId> key), or to /library
    if there is none.
  - The main navigation has ONE tab, labelled "Read" (new key nav.read in
    ja/en/zh), active on both /library and /reader/*, linking to /library.
    It replaces the old reader tab; keep `nav.tabs [data-tab="reader"]` as
    the tab's hook, so the existing specs still find it.
  - Language-gated like the old reader route.

  C3 Data hooks (LIB-002 produces in frontend/src/features/library/data/;
  LIB-003/004 use).
  - useLibraryMaterials({ category, search }): an infinite query over C1's
    list (pages of 50), polling while any work is importing or translating,
    as MaterialList does today.
  - useCategories(): returns { categories, totalCount, uncategorisedCount }.
  - useCategoryMutations(): returns { create(name), rename(id, name),
    reorder(ids), remove(id) }. Each invalidates categories and library
    materials.
  - useAssignCategory(): returns assign(materialId, categoryId | null), with
    an optimistic update of the list and counts and rollback on error.
  - Query keys go under queryKeys.library.* and queryKeys.categories.* in
    lib/api/query-keys.ts.

  C4 Library and category-sidebar connection (LIB-002 creates the stubs;
  LIB-003 owns LibraryPage, LIB-004 owns the sidebar).
  - LibraryPage renders
    <CategorySidebar selected={category} onSelect={(c) => …} /> from
    frontend/src/features/library/categories/CategorySidebar.tsx, where
    category is "all" | "uncategorised" | number.
  - Drag source (LIB-003): each work row is draggable and sets
    dataTransfer "application/x-word-marker-material" = String(materialId).
    Drop targets (LIB-004) read that type, call
    useAssignCategory().assign(id, categoryId | null) (Uncategorised = null;
    All isn't a drop target), and show a drop indicator.
  - Keyboard and touch alternative (LIB-003): each row's ⋯ menu has
    "Move to category ▸", listing Uncategorised plus the user categories
    from useCategories() and calling assign.
  - Ids: the sidebar root is #libraryCategories; each category item has
    data-category="all" | "uncategorised" | "<id>".

  General rules: follow AGENTS.md (localisation in ja/en/zh, mobile
  parity ≤760px, design consistency with the kit and the existing settings
  primitives, TypeScript docs, and commits allowed). Follow
  frontend/src/CONTRACTS.md, including the Motion conventions and reduced
  motion. Interface contracts are fixed: if one blocks you, stop and report
  rather than improvise. Never kill processes on ports you weren't assigned
  (3000/5173 may be the user's servers). The login rate limiter (10 per 15
  minutes) can cause 429s in the admin/superadmin specs; restart the API and
  rerun, and identify any 429s explicitly.
implementation_notes: >
  Run this after LIB-003..006 are merged into the feature base branch. Avoid behaviour changes: renames and cleanup only, plus tests.
