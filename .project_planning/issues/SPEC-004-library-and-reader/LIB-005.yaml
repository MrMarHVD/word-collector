code: LIB-005
title: "Reader: focus-only view, top bar and Aa settings overlay"
status: to do
spec: SPEC-004-library-and-reader
summary: >
  Make the Reader the distraction-free view only: remove the reader sidebar, tabs and normal mode, and add a top bar (title, Aa, exit to the Library) and an overlay settings panel with every reader setting.
scope:
  files:
    - "frontend/src/features/reader/** (excluding translation/ service internals)"
    - "frontend/src/components/app/AppShell.tsx (focus/reader body-class wiring only)"
    - "frontend/src/stores/reader-preferences.ts (stop reading obsolete keys, without deleting them)"
    - "frontend/public/locales.json (reader.* keys)"
  layers:
    - frontend
  description: >
    In scope: SPEC-004 FR-19..23.
    - Today's focus mode becomes the only Reader layout. Remove the non-focus layout, the sidebar, the tabs, the toolbar controls and their layout code. Keep the shared Sidebar and use-animated-sidebar, which vocab still uses.
    - The top bar holds the title, the Aa button (#readerSettingsButton, aria-label localised) and exit (#readerFocusExit kept), which navigates to /library, preferring history back.
    - The settings panel overlays the text without resizing it: a non-modal Popover on desktop and a bottom Sheet (modal={false}) on mobile.
    - The panel contains font size, words per page, text width (desktop), highlight opacity, show word spaces and both auto-mark switches, using SettingSection/SettingRow. Fit-to-page re-fits on font or width change.
    - Escape order: settings panel, then translation popup, then word-info, then exit.
    - Outside interactions close the panel without triggering reader gestures.
    - Call C1 POST /api/materials/:id/opened when a work is opened.

    Out of scope: Library and dashboard.
dependencies:
  - LIB-002
acceptance_criteria:
  - "The Reader shows only the reading view, with a top bar holding the title, Aa and exit. The old sidebar, tabs and normal mode are gone."
  - "Aa opens an overlay panel with every reader setting. Changes apply live, the text never resizes when the panel opens, and fit re-fits after font or width changes."
  - "The panel closes via Aa, its close control, an outside click or tap (with no word selection or gesture underneath), and Escape (first in the Escape order). Focus returns to Aa."
  - "Word-info, sentence translation, the quick menu, page turns, progress and focus-mode contrast all work as before."
  - "Exit returns to the Library. Opening a work records last-opened (C1)."
  - "Desktop and mobile are complete in both themes; strings exist in ja/en/zh. The reader-translation spec passes, with only listed internal-coupling edits."
verification:
  - "In frontend/, `npm run lint`, `npm run typecheck`, `npm test` and `npm run build` all pass."
  - "Run Playwright against your own servers (PW_FRONTEND_URL/PW_API_URL on your assigned ports, which the config auto-starts)."
  - "Review screenshots at 1280 and 390, light and dark, in en plus one CJK locale."
  - "Ports: PW_FRONTEND_URL=http://localhost:5405 PW_API_URL=http://localhost:3205. Run reader-translation and app, plus a throwaway check of the panel (open, change font size, the fit re-fits, Escape, and outside tap without selection)."
special_context: |
  C1 API (LIB-001 produces; LIB-002 wraps it in the typed client). All
  endpoints require auth plus CSRF on mutations, and enforce ownership (404
  for another user's resources).
  - GET /api/categories?languageId=N
      -> 200 { categories: [{ id, name, position, materialCount }],
              totalCount, uncategorisedCount }
         categories are ordered by position.
  - POST /api/categories { languageId, name }
      -> 201 { category }; 409 errorKey "errors.categoryNameTaken" for a
         case-insensitive duplicate; 400 for an empty or too-long name
         (max 60 chars, trimmed).
  - PATCH /api/categories/:id { name } -> 200 { category }; 409 or 400 as
    above.
  - PUT /api/categories/order { languageId, ids: number[] }
      -> 200 { categories }; ids must be exactly the user's categories for
         that language.
  - DELETE /api/categories/:id -> 200 { ok: true }; its works become
    uncategorised, and works are never deleted.
  - PATCH /api/materials/:id accepts { categoryId: number | null } (in
    addition to the existing fields). The category must belong to the same
    user and language (400 otherwise); null means uncategorised.
  - POST /api/materials/:id/opened -> 200 { lastOpenedAt }: records that the
    work was opened in the Reader.
  - GET /api/materials?languageId=N&offset=&search=&category=all|uncategorised|<id>
      keeps the existing params and response shape ({ materials, pageSize })
      and adds category filtering. Each material item gains categoryId
      (number|null), lastOpenedAt (ISO|null), readTokens and totalTokens
      (reading progress, as the dashboard documents use), on top of the
      existing id, title, fileType, wordCount, readerStart, createdAt and
      import status fields. Default sort: lastOpenedAt DESC NULLS LAST, then
      createdAt DESC, then id DESC. search matches the title
      case-insensitively.

  C2 Routes and Library address (LIB-002 produces; LIB-003/004/005/006 use).
  - /library — the Library. Search params:
    - category = all | uncategorised | <categoryId> (default all);
    - q = search text;
    - focus = <materialId>: the dashboard "go to" target. The Library selects
      category=all, clears q, scrolls the work into view, outlines it with a
      transition, then removes focus from the address (replace) so a reload
      doesn't repeat it.
  - /reader/:materialId — the Reader for that work.
  - /reader — redirects to the last-opened work for the study language
    (lastOpenedAt from C1, falling back to the existing
    wordMarkerSelectedMaterialId:<userId>:<languageId> key), or to /library
    if there is none.
  - The main navigation has ONE tab, labelled "Read" (new key nav.read in
    ja/en/zh), active on both /library and /reader/*, linking to /library.
    It replaces the old reader tab; keep `nav.tabs [data-tab="reader"]` as
    the tab's hook, so the existing specs still find it.
  - Language-gated like the old reader route.

  General rules: follow AGENTS.md (localisation in ja/en/zh, mobile
  parity ≤760px, design consistency with the kit and the existing settings
  primitives, TypeScript docs, and commits allowed). Follow
  frontend/src/CONTRACTS.md, including the Motion conventions and reduced
  motion. Interface contracts are fixed: if one blocks you, stop and report
  rather than improvise. Never kill processes on ports you weren't assigned
  (3000/5173 may be the user's servers). The login rate limiter (10 per 15
  minutes) can cause 429s in the admin/superadmin specs; restart the API and
  rerun, and identify any 429s explicitly.
implementation_notes: >
  Radix Select inside a Popover portals out, so it can count as an outside interaction. Guard against that with onInteractOutside. Reader gestures listen on #readerText, so stop propagation from the panel. Respect the existing reader-preference keys.
